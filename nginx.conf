# try_files $uri /index.html은 요청한 파일이 있으면 주고, 없으면 index.html을 줌.
# 이게 SPA 새로고침 404를 막음.

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # 없는 번들 파일에 index.html(text/html)을 주면 옛 화면을 연 사용자가 MIME 에러를 만나서 404로 돌려준다
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html은 캐시하지 않아야 새 배포가 바로 반영된다
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
