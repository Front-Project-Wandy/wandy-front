# main에 merge(push)되면 이미지를 빌드해 GHCR에 올리고, EC2에서 컨테이너를 교체한다.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 먼저 시작한 것을 끝낸 뒤 다음을 실행한다
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # GHCR 이미지 이름은 소문자만 허용한다
  IMAGE: ghcr.io/front-project-wandy/wandy-front
  # EC2의 호스트 키 지문(공개 값). 다른 서버로 SSH 키가 가지 않게 접속 대상을 고정한다.
  # EC2를 새로 만들면 `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub`로 확인해 바꾼다.
  EC2_HOST_FINGERPRINT: SHA256:7wYibverVipmSgIDMeG97QOPKa7NWF9NW4wJoihfYqE

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # EC2가 x86_64라서 amd64로 빌드한다. 지도 키는 빌드 때 번들에 들어간다.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_NAVER_MAP_CLIENT_ID=${{ secrets.VITE_NAVER_MAP_CLIENT_ID }}
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: compose.yaml을 EC2로 복사
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ env.EC2_HOST_FINGERPRINT }}
          source: compose.yaml
          target: ~/wandy

      # 패키지가 private여도 받을 수 있게 이 실행에서만 유효한 토큰으로 로그인한다
      - name: EC2에서 새 이미지로 교체
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ env.EC2_HOST_FINGERPRINT }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/wandy
            docker compose pull
            docker compose up -d
            docker logout ghcr.io
            docker image prune -f
