<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 검색·공유 미리보기·홈 화면 추가 (98). React가 뜨기 전에 읽히는 정보라 번역 파일이 아니라 여기에 둔다.
         색 값은 디자인 토큰 primary(#0284C7)와 같게 맞춘다 (HTML 메타 태그는 CSS 변수를 읽지 못한다). -->
    <meta
      name="description"
      content="한국·일본 여행 일정 플래너. 가고 싶은 곳부터 고르면 DAY별 일정과 이동 동선을 한 번에 계획해요."
    />
    <meta name="theme-color" content="#0284c7" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 공유 카드(Open Graph). 카카오톡·디스코드는 이미지 주소가 https://로 시작하는 전체 주소여야 읽어서,
         배포 주소를 VITE_SITE_URL(.env.example)로 받는다. 빌드할 때 Vite가 %VITE_SITE_URL%을 값으로 바꾼다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wandy" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="Wandy · 한국·일본 여행 일정 플래너" />
    <meta
      property="og:description"
      content="가고 싶은 곳부터, 나만의 여행이 시작돼요. 장소 · 일정 · 이동을 한 번에 계획하세요."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wandy 로고와 한국·일본 여행 일정 플래너 문구" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap"
    />
    <title>Wandy</title>
    <!-- 다크모드(89): React가 뜨기 전에 테마를 정해서 새로고침 때 흰 화면이 번쩍이지 않게 한다.
         저장 키는 src/components/common/useTheme.js의 THEME_STORAGE_KEY와 같아야 한다. -->
    <script>
      try {
        const saved = localStorage.getItem('wandy.theme');
        const isDark = saved
          ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
